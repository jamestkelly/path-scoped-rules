name: Checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set Up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and Test Plugin
        run: pnpm validate
      - name: Check Source-Only Checkout
        run: test -z "$(git ls-files -- dist)"
      - name: Install and Load Packed Plugin
        run: bash scripts/smoke-package.sh
  branch-name:
    name: Validate Source Branch
    if: github.event_name == 'pull_request'
    permissions: {}
    uses: jamestkelly/branch-name-check/.github/workflows/branch-name-check.yml@1cb7c8ecfab5ec076f278a9b3c84f9ae108e49e1
  review-gate:
    name: Review Gate
    if: always() && github.event_name == 'pull_request'
    needs: [validate, branch-name]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Review Results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
