name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Out Release History
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set Up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set Up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Release Commit
        run: |
          pnpm build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/package-release.sh
      - name: Install Candidate With OpenCode
        run: bash scripts/smoke-git-install.sh "$(git rev-parse HEAD)"
      - name: Publish Version and Release Notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: GITHUB_REF=refs/heads/release-dist GITHUB_SHA=$(git rev-parse HEAD) pnpm exec semantic-release
      - name: Advance Released Major Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(git tag --points-at HEAD --list 'v*.*.*' --sort=-version:refname | head -1)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 0
          gh release view "$version" >/dev/null
          major=${version%%.*}
          previous=$(git ls-remote --refs origin "refs/tags/$major" | cut -f1)
          if [[ -n "$previous" ]]; then git merge-base --is-ancestor "$previous" HEAD; fi
          git push --force-with-lease="refs/tags/$major:$previous" origin "HEAD:refs/tags/$major"
          printf 'Install with: opencode plugin add github:%s#%s\n' \
            "$GITHUB_REPOSITORY" "$version" >> "$GITHUB_STEP_SUMMARY"
